services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prometheus
      POSTGRES_USER: prometheus_app
      POSTGRES_PASSWORD: prometheus_dev_password
    ports:
      - "5434:5432" # host 5434 to avoid clashing with other local Postgres containers
    volumes:
      - prometheus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometheus_app -d prometheus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prometheus_postgres_data:
